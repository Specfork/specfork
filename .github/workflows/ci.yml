name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: specfork_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: CGO_ENABLED=0 go build ./...
      - run: go vet ./...
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/specfork_test?sslmode=disable

  # The required check of the `main` ruleset (MajidBabaeifar/ci REPO-2, REPO-3). The job id stays `ci-ok` because
  # the ruleset matches it; readable names for this repo's jobs wait for intent 261025-1407-5.
  ci-ok:
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a job ended $r"; exit 1 ;; esac
          done

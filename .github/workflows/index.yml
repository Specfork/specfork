# IDX-1, IDX-9: crawl GitHub hourly and publish index.json and the site to Pages.
name: index
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Crawl
        run: go run ./cmd/specfork crawl --names registry/names.json --out _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # MCP-9: usage counters from the hosted server; unset builds the site without numbers.
          SPECFORK_STATS_URL: ${{ vars.SPECFORK_STATS_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5

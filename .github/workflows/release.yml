# CLI-10..14: release-please opens the release PR; merging it tags v*, then this workflow builds the
# binaries, attests them, publishes the npm packages and updates the Homebrew tap.
# npm trusted publishing is configured per package for repo Specfork/specfork, workflow release.yml.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/build-release.sh "${{ needs.release-please.outputs.version }}" dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/specfork_*.tar.gz
            dist/specfork_*.zip
            dist/checksums.txt
      - name: Upload release assets
        run: gh release upload "${{ needs.release-please.outputs.tag }}" dist/specfork_*.tar.gz dist/specfork_*.zip dist/checksums.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/bin
            dist/checksums.txt

  npm:
    needs: [release-please, assets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC); no stored token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Build packages
        run: node npm/build.js "${{ needs.release-please.outputs.version }}" dist/bin dist/npm
      - name: Smoke test the host package
        run: |
          mkdir -p dist/pack
          pkg=$(npm pack ./dist/npm/cli-linux-x64 --pack-destination dist/pack)
          tar -xzf "dist/pack/$pkg" -C dist/pack
          dist/pack/package/bin/specfork --version
      - name: Publish, platform packages first
        run: |
          for d in dist/npm/cli-*; do npm publish "$d" --access public --provenance; done
          npm publish dist/npm/specfork --access public --provenance

  brew:
    needs: [release-please, assets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Skip until the tap token exists
        if: ${{ env.TAP_TOKEN == '' }}
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap was not updated"
      - uses: actions/checkout@v7
        if: ${{ env.TAP_TOKEN != '' }}
      - uses: actions/download-artifact@v8
        if: ${{ env.TAP_TOKEN != '' }}
        with:
          name: dist
          path: dist
      - uses: actions/checkout@v7
        if: ${{ env.TAP_TOKEN != '' }}
        with:
          repository: Specfork/homebrew-tap
          token: ${{ env.TAP_TOKEN }}
          path: tap
      - name: Update the formula
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          mkdir -p tap/Formula
          scripts/brew-formula.sh "${{ needs.release-please.outputs.version }}" dist/checksums.txt > tap/Formula/specfork.rb
          cd tap
          git config user.name "specfork-release"
          git config user.email "release@specfork.dev"
          git add Formula/specfork.rb
          git diff --cached --quiet || git commit -m "specfork ${{ needs.release-please.outputs.version }}"
          git push
